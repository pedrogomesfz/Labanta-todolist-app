# docker-compose.yml

version: '3.8'

services:
  # Serviço da base de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: pg-todolist
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todolist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - todolist-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todolist"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Serviço da aplicação Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=todolist
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todolist-network
    command: npm run dev
    restart: unless-stopped

  # (Opcional) Adminer - Interface web para gerir a base de dados
  adminer:
    image: adminer:latest
    container_name: todolist-adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - todolist-network
    depends_on:
      - postgres
    restart: unless-stopped

# Volumes persistentes
volumes:
  postgres_data:
    driver: local

# Redes
networks:
  todolist-network:
    driver: bridge